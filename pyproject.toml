[project]
name = "chimera-agentic-infrastructure"
version = "0.1.0"
description = "Spec-driven, governed agentic infrastructure for Project Chimera"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.6",
]

# -------------------------
# Development dependencies
# -------------------------
[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.5.0",  # UPDATED: Changed from 0.4.0 to 0.5.0+
]

# -------------------------
# Pytest configuration
# -------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

# -------------------------
# Ruff (Linting & Security) - Modern configuration
# -------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

# Exclude patterns
exclude = [
    "specs",
    "research",
    ".venv",
    "__pycache__",
]

# Lint configuration
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "B",   # flake8-bugbear (likely bugs)
    "S",   # security rules (bandit-style)
    "I",   # import sorting
]

# Global ignores
ignore = [
    "E501",  # line length (handled separately)
]

# Per-file ignores for tests
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # asserts are expected in tests
    "B009",  # getattr used for interface probing
    "F401",  # pytest imports may be implicitly used
]

# -------------------------
# Build system
# -------------------------
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# -------------------------
# Packaging safety
# -------------------------
# Prevent accidental packaging of non-runtime directories
[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "specs*",
    "research*",
    "skills*",
]