[project]
name = "chimera-agentic-infrastructure"
version = "0.1.0"
description = "Spec-driven, governed agentic infrastructure for Project Chimera"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["specs*", "research*", "skills*"]
